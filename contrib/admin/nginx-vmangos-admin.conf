# TLS front end for the vmangos admin panel.
#
# There is deliberately no port 80 listener. Renewal uses the DNS-01 challenge, so
# nothing here needs to answer plaintext HTTP, and the firewall does not allow it
# either. Browsers try HTTPS first for a typed hostname, so this costs nothing.
#
# Reachability is enforced by nftables (443 from @private_v4 only), not by the listen
# address, so that the panel survives a change of the Pi's LAN address.

server {
    # Anything that arrives for a name we do not serve, including a bare IP address,
    # gets the connection closed rather than a copy of the panel.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/vmangos-admin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmangos-admin/privkey.pem;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.moonlight.cx;

    ssl_certificate     /etc/letsencrypt/live/vmangos-admin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vmangos-admin/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # No ssl_stapling: Let's Encrypt has retired its OCSP responders and no longer puts
    # an OCSP URL in the certificate, so enabling it would only log errors.

    server_tokens off;
    client_max_body_size 2m;

    access_log /var/log/nginx/vmangos-admin.access.log;
    error_log  /var/log/nginx/vmangos-admin.error.log;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwritten, never appended: the app runs ProxyFix with x_for=1 and would
        # otherwise take a client-supplied X-Forwarded-For as the real source address
        # and let an attacker sidestep the login throttle.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_read_timeout 120s;
    }
}
